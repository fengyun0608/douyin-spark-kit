name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 门禁 1：客户端 ──
  app:
    name: App / analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sparkpal/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      - name: 构建（debug，验证能出包）
        run: flutter build apk --debug

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: sparkpal/app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ── 门禁 2：服务端 ──
  server:
    name: Server / vet + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sparkpal/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: sparkpal/server/go.sum

      - name: 依赖
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: 编译
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/spark-api ./cmd/spark-api

  # ── 门禁 3：禁止把密钥和产物提交进来 ──
  guard:
    name: Guard / 禁止密钥与产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查禁止提交的文件
        run: |
          set -e
          fail=0

          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|prod|production)$'; then
            echo "::error::检测到 .env 被提交"; fail=1
          fi

          if git ls-files | grep -E '\.(apk|aab|ipa)$'; then
            echo "::error::检测到安装包被提交"; fail=1
          fi

          if git ls-files | grep -E '(^|/)spark-api$'; then
            echo "::error::检测到编译产物被提交"; fail=1
          fi

          if git ls-files | grep -E '(^|/)local\.properties$'; then
            echo "::error::检测到 local.properties 被提交"; fail=1
          fi

          if git grep -nIE '(BEGIN (RSA|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16})' -- . ; then
            echo "::error::检测到疑似私钥"; fail=1
          fi

          exit $fail
